[project]
name = "blog_utils"
version = "0.0.0"
description = "Utilities for common blogging needs in Jupyter."
authors = [
  { name = "Diogenes Analytics", email = "diogenesanalytics@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "matplotlib>=3",
    "numpy>=2,<3",
    "opencv-python>=4.11.0.86",
    "pillow>=11.1.0"
]
homepage = "https://github.com/DiogenesAnalytics/blog_utils"
repository = "https://github.com/DiogenesAnalytics/blog_utils"
classifiers = [
    "Development Status :: 1 - Planning",
]

[project.urls]
Changelog = "https://github.com/DiogenesAnalytics/blog_utils/releases"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
Pygments = ">=2.10.0"
black = ">=21.10b0"
coverage = {extras = ["toml"], version = ">=6.2"}
darglint = ">=1.8.1"
deptry = "^0.23.0"
flake8 = ">=4.0.1"
flake8-bugbear = ">=21.9.2"
flake8-docstrings = ">=1.6.0"
flake8-rst-docstrings = ">=0.2.5"
furo = ">=2021.11.12"
isort = ">=5.10.1"
mypy = ">=0.930"
nox = ">=2023.4.22"
nox-poetry = ">=1.0.3"
pep8-naming = ">=0.12.1"
pre-commit = ">=2.16.0"
pre-commit-hooks = ">=4.1.0"
pytest = ">=6.2.5"
pyupgrade = ">=2.29.1"
typeguard = ">=2.13.3"
xdoctest = {extras = ["colors"], version = ">=0.15.10"}
myst-parser = {version = ">=0.16.1"}

[tool.black]
target-version = ["py311"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["blog_utils", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.isort]
profile = "black"
force_single_line = true

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_context = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
